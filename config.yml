# ═════════ 6. SPONSOR & WORK PERMIT ═════════
# Di negara dengan sponsor: required -> job yang cocok "negative" dibuang; job yang minta izin kerja sendiri ("work_auth")
# tanpa menyebut sponsor juga dibuang. "positive" memberi nilai plus.
sponsorship:
  # true = di negara yang WAJIB sponsor (UK, Australia, Malaysia, Gulf, dst.) hanya job yang MENYEBUT sponsor (atau company terdaftar
  # di daftar sponsor resmi UK) yang dikirim. false = job tanpa sebutan sponsor tetap dikirim dengan penalti skor.
  require_explicit: true
  # Instansi pemerintah/universitas di negara ini hampir tidak pernah mensponsori: dibuang KECUALI teksnya menyebut sponsor. Cocok pada NAMA COMPANY.
  public_sector_countries: [australia, new_zealand]
  public_sector_terms: [government, "department of", "ministry of", council, "public service", "state of", "state library", "health service*", tafe, polytechnic, "university of", universit*, "te whatu ora", "te kawanatanga", "nz police", "defence force", "nsw ", "qld "]
