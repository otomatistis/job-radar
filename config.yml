# ═════════ 9. PROFIL & SKOR "COCOK" (0-100) ═════════
# Tahap 1 (gratis): skor aturan dari judul, skill, sponsor, negara.
# Tahap 2 (opsional, gratis): Gemini menilai lebih dalam bila secret GEMINI_API_KEY diisi. Bagian summary & notes di bawah dibaca Gemini.
profile:
  summary: >
    Operations generalist with an MSc in International Management (University of Galway, 2.1 Honours, Nov 2025;
    coursework in project management, supply chain, global strategy, business transformation, international consulting).
    Hands-on experience in food manufacturing (ERP/MES, HACCP, FSSC 22000, GMP, stock reconciliation, quality control,
    production records), retail operations (POS, goods-in checks, ERP entry), horticulture/agriculture (greenhouses, nursery,
    B2B supply) and currently remote generative-AI data evaluation (Outlier AI: structured quality rationales, guideline feedback).
    Worked in Australia, Ireland, Indonesia and the US. English C2 and Bahasa Indonesia.
    Tools: Excel, Power BI (basic), Google Workspace, Notion, ClickUp, Slack, LLM tools.
  notes: >
    REAL experience is fragmented: several short stints (retail about 3 months, manufacturing a few months, seasonal horticulture),
    roughly 1.5 to 2 years of full-time-equivalent relevant work. It is NOT 4 solid years. Entry to junior level only; never senior,
    manager-level reach, director or head roles. Target: operations, business support, project support/officer, production planning,
    market research/entry/access, business development, international/global operations or strategy, sustainability coordination,
    in FMCG, agriculture, horticulture, food manufacturing, retail, wholesale, consulting, MNE/SME.
    AI roles: ONLY non-technical AI operations (data quality, evaluation, annotation, AI project/program coordination, AI adoption support).
    Reject anything needing programming, SQL/Python, ML engineering, data science, IT/infrastructure skills or a computer science/engineering degree.
    The candidate is a NON-CODER: any role whose core duties are technical/coding/IT is a poor fit.
    Avoid industries: alcohol, pork, gambling, banking/finance/tax/law, medical/pharma, pure engineering, construction, insurance.
    Full-time or contract only. Strong plus: sponsorship, relocation package, willingness to travel is fine.
    Soft skills are generic; weigh the technical skills above.
  target_titles: ["operations coordinator", "operation coordinator", "operations specialist", "operations analyst", "operations associate", "operations officer", "operations assistant", "business operations", "business operation", "business support", "business associate", "business development", "project officer", "project associate", "project support", "project coordinator", "production planner", "production planning", "production coordinator", "supply chain coordinator", "supply chain analyst", "supply chain associate", "global operations", "international operations", "global strategy", "international strategy", "market access", "market research", "market entry", "virtual assistant", "sustainability coordinator", "sustainability analyst", "sustainability officer", "quality coordinator", "quality control", "quality assurance", "inventory", "procurement", "logistics coordinator", "business analyst", "management trainee", "graduate programme", "graduate program", "graduate scheme", "AI operations", "AI data", "data annotation", "LLM evaluation", "AI quality", "AI project coordinator"]
  weak_titles: [associate, officer, coordinator, planner, operative, operations, operation, production, manufacturing, assistant, analyst, project, support, specialist]
  avoid_title_soft: [manager, "team lead", supervisor]       # kurangi poin (bukan dibuang)
  skills: [erp, mes, excel, "power bi", haccp, "fssc 22000", gmp, "quality control", "quality assurance", "root cause", "inventory*", "stock", "sop*", "non-conformance*", "production planning", "data validation", reporting, documentation, "project coordination", "process improvement", "supply chain", "cold chain", "market research", "generative ai", "llm*", "annotation", "ai evaluation", "stakeholder*", "cross-functional", clickup, notion, "google workspace", procurement, logistics, horticulture, agriculture, greenhouse, nursery, hydroponic*, "food safety", b2b, negotiation, consulting, strategy, "food manufacturing", fmcg]
  # Industri targetmu: ada jejaknya di judul/company/deskripsi -> skor naik; tidak ada sama sekali -> skor turun.
  target_industry_terms: [fmcg, "consumer goods", food, "food manufacturing", "food safety", haccp, agri*, agronom*, horticultur*, nursery, greenhouse, hydroponic*, farm*,
    "fresh produce", retail*, wholesale*, grocery, supermarket*, "supply chain", logistics, procurement, "cold chain", distribution, manufacturing, sustainab*, esg,
    "circular economy", consulting, consultancy, "market research", "market entry", "market access", "international trade", export*, import*]
  boost_any: ["relocation*", "willingness to travel", "willing to travel", "international travel"]

scoring:
  min_score_rules: 50          # ambang kirim kalau TANPA Gemini
  min_score_ai: 60             # ambang kirim kalau Gemini aktif
  # Tier 'MUNGKIN cocok': skor di bawah ambang kirim tapi di atas angka ini -> dikirim sebagai 1 digest ringkas (bukan kartu).
  min_score_maybe: 38          # 0 = matikan tier ini
  min_score_ai_maybe: 48       # sama, untuk skor dari Gemini
  use_gemini: true             # false = matikan Gemini walau secret ada
  # Dicoba berurutan. Kalau semua ditolak, radar otomatis mencari model flash yang tersedia di akunmu.
  gemini_models: [gemini-2.5-flash-lite, gemini-2.5-flash, gemini-2.0-flash]
  gemini_max_per_run: 25       # batas job yang dinilai Gemini per run (jaga kuota gratis)
  gemini_min_rule_score: 30    # job dengan skor aturan di bawah ini tidak dikirim ke Gemini
  # Bobot skor aturan (opsional, ubah kalau hasil terasa kurang pas):
  # weights: { title_target: 40, title_weak: 15, skill_each: 5, skill_max: 25, sponsor_pos_required: 20, sponsor_unknown_required: -10 }


# ═════════ 10. TELEGRAM ═════════
telegram:
  max_messages_per_run: 25     # kartu lengkap per run; sisanya dikirim sebagai digest ringkas (beberapa pesan, tidak ada yang hilang)
  max_digest_items: 60         # batas job di digest 'cocok lainnya' per run (kelebihannya muncul di run berikutnya)
  max_maybe_items: 40          # batas job di digest 'mungkin cocok' per run
  alert_on_errors: true        # kabari kalau sumber gagal (hanya kalau berubah, tidak spam)
  daily_summary: true          # 1 pesan "radar masih hidup" per hari
  summary_hour_utc: 6          # dikirim di run pertama setelah jam ini (UTC). 6 = run 06:17 UTC
