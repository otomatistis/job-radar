profile:
  summary: 'MSc International Management (University of Galway), BSc Landscape Architecture (IPB). Practical operations
    experience in Australia, Ireland, Indonesia and USA. Food manufacturing: production, HACCP/GMP compliance, ERP/MES
    entries, stock checks, inventory discrepancy investigation, quality records. Retail: incoming goods verification,
    till/POS reconciliation and customer service. Horticulture and greenhouse operations. Remote AI data evaluation:
    multimodal output quality review and structured rationales. English EF SET C2 and Bahasa Indonesia. No software
    engineering, machine learning engineering or advanced data science background.'
  notes: Roles should be individually junior/associate/experienced-support level. Separate short jobs across sectors
    do not imply four continuous years of a single specialty. Do not assume advanced Power BI, programming, logistics
    ownership, formal project leadership, sales quota experience, or professional consulting. No driving licence
    or own transport. Not interested in supply-chain-centric jobs, banking, insurance, tax, law, medicine, construction,
    casinos, pork or alcohol. Overseas onsite/hybrid usually needs visa sponsorship; Ireland Stamp 1G is time-limited
    and not proof of permanent authorization. Jobs with no sponsorship information need verification, not automatic
    rejection. Prefer travel/relocation, only full-time or fixed-term contract. Remote worldwide or explicitly eligible
    to work from Indonesia; Malaysia remote possible, but confirm legal employment constraints.
