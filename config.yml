# ╔════════════════════════════════════════════════════════════════╗
# ║  JOB RADAR — satu-satunya file yang kamu edit                  ║
# ║  github.com → buka file ini → ikon pensil → Commit.            ║
# ║  Run berikutnya otomatis pakai isi terbaru.                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# ATURAN MENULIS
#   • Tidak peka huruf besar/kecil. Cocok per KATA UTUH: "tax" tidak cocok dengan "taxonomy".
#   • Tanda * = akhiran bebas: "sponsor*" cocok sponsor/sponsors/sponsorship.
#   • Frasa boleh: "right to work". Daftar kosong [] = fitur itu mati.
#   • Pakai SPASI (bukan tab). Jangan hapus tanda "-", "[ ]", atau kutip.
#   • Salah format? Radar kirim pesan "config.yml rusak" ke Telegram, tidak diam-diam gagal.


# ═════════ 1. SUMBER & WAKTU ═════════
sites: [indeed]               # indeed paling stabil dari server GitHub. linkedin sering diblok -> tambahkan sendiri kalau mau.
hours_old: 14                 # ambil job yang diposting dalam N jam terakhir. Harus > jarak antar run (6 jam) supaya tidak ada yang lolos.
results_per_search: 40        # maks hasil per pencarian
max_search_minutes: 8         # BATAS waktu pencarian Indeed per run. Menjaga jatah 2.000 menit GitHub tidak habis.
                              # Pencarian yang belum sempat jalan dilanjutkan di run berikutnya (dirotasi otomatis).
                              # Situs yang error/diblok otomatis dilewati sisa run itu (tidak buang menit).


# ═════════ 2. NEGARA TARGET ═════════
