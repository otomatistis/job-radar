# ═════════ 3. PENCARIAN ROLE (dipasangkan otomatis dengan SETIAP negara di atas) ═════════
# Sintaks Indeed: "frasa persis", OR, tanda minus (-kata) untuk mengecualikan.
# 4 query x ~18 negara = ~72 pencarian, dirotasi dalam budget waktu.
role_queries:
  - '("operations coordinator" OR "operations associate" OR "operations specialist" OR "operations analyst" OR "operations officer" OR "operations assistant" OR "business operations" OR "business support" OR "business associate")'
  - '("project officer" OR "project associate" OR "project support" OR "project coordinator" OR "production planner" OR "production planning" OR "production coordinator" OR "supply chain coordinator" OR "supply chain analyst" OR "quality coordinator" OR "inventory coordinator")'
  - '("business development" OR "market research" OR "market entry" OR "market access" OR "international strategy" OR "global strategy" OR "global operations" OR "international operations" OR "sustainability coordinator" OR "virtual assistant")'
  - '("AI operations" OR "AI project coordinator" OR "AI data specialist" OR "AI quality" OR "data annotation" OR "LLM evaluation" OR "AI trainer" OR "AI program coordinator")'

# Pencarian tambahan manual (opsional), contoh: { term: "operations coordinator", location: "Ireland", country: ireland }
# Catatan: filter "remote" hanya jalan di Indeed (LinkedIn mengabaikannya). Job remote tetap tertangkap lewat pencarian biasa.
extra_searches: []


# ═════════ 3b. LINKEDIN (dua tahap, supaya cepat & hemat risiko blokir) ═════════
# Tahap 1: ambil daftar job (tanpa deskripsi, cepat). Tahap 2: filter judul/negara dulu, baru ambil DESKRIPSI
# hanya untuk yang lolos (maks max_descriptions per run, jeda acak, berhenti kalau 3x gagal berturut-turut).
# LinkedIn sering memblokir IP server (termasuk GitHub). Kalau diblok: radar kirim alert 1x, melewati LinkedIn sisa run,
# dan Indeed/company tetap jalan. Cek hasilnya lewat mode dry-run.
# Query LinkedIn dipisah & ringkas (LinkedIn lambat: ±3-7 detik per halaman), dirotasi lintas run.
linkedin:
  enabled: true
  max_minutes: 4              # batas waktu listing LinkedIn per run
  hours_old: 72               # lebih longgar dari Indeed: LinkedIn lambat, tiap kombinasi baru dikunjungi lagi setelah beberapa run
  results_per_search: 25
  max_descriptions: 45        # batas pengambilan deskripsi per run (tiap job = 1 request ke LinkedIn)
  queue_hours: 96             # job yang lolos tahap 1 tapi belum sempat diambil deskripsinya masuk antrean, dibuang kalau lebih tua dari ini
  queries:
    - '("operations coordinator" OR "operations associate" OR "operations analyst" OR "business support" OR "business operations" OR "project coordinator" OR "project officer" OR "supply chain coordinator")'
    - '("business development" OR "market research" OR "market entry" OR "international operations" OR "sustainability coordinator" OR "production planner" OR "AI operations")'


# ═════════ 4. CAREER PAGE COMPANY LANGSUNG (API resmi, bukan scraping) ═════════
# Cara cari slug: Actions -> job-radar -> Run workflow -> mode "find-companies" -> isi nama company (pisah koma).
# Hasilnya dikirim ke Telegram. Tempel slug yang ketemu ke daftar di bawah. Muat ~15-20 nama per run.
# Filter negara/bahasa/sponsor/gaji di bawah berlaku juga untuk job dari company.
companies:
  enabled: true
  max_age_days: 14
  title_any: [operation, operat, coordinator, associate, officer, assistant, analyst, specialist, support, project, programme, program, business, strategy, market, sustainab, supply, logistic, production, planner, planning, quality, procure, consult, development, trainee, graduate, administrator]
  greenhouse: []              # contoh: [intercom, workhuman]
  lever: []
  ashby: []
  smartrecruiters: []         # API publik resmi; identifier = bagian URL jobs.smartrecruiters.com/<identifier>

  # WORKDAY (banyak company besar). API internal, tidak resmi -> bisa berubah sewaktu-waktu.
  # Cara: buka career page company -> klik daftar job -> copy URL sampai nama site-nya:
  #   https://namacompany.wd3.myworkdayjobs.com/en-US/NamaSite
  # Tes dulu: Actions -> Run workflow -> mode find-companies -> tempel URL-nya di kolom names.
  workday: []                 # contoh: ["https://namacompany.wd3.myworkdayjobs.com/en-US/NamaSite"]
  workday_search: [operations, coordinator, project, business, "supply chain", production, planning, sustainability, quality, analyst]   # dicari di server Workday
  workday_max_pages: 2        # x20 job per istilah pencarian
  workday_max_details: 60     # batas job BARU yang diambil detailnya per run (tiap job = 1 request)


# ═════════ 4b. SUMBER TAMBAHAN: portal remote, agregator lokal, Bayt, daftar sponsor resmi ═════════
# Semuanya melewati filter keras & skor yang SAMA dengan Indeed/LinkedIn. Sumber yang gagal tidak mematikan run.
feeds:
  enabled: true
  max_minutes: 3                 # batas waktu total bagian ini per run
  max_age_days: 7
  # Portal remote (tanpa key, API publik). Hapus nama yang tidak mau. Remote hanya lolos kalau worldwide / negara targetmu.
  boards: [remoteok, jobicy, himalayas, weworkremotely, remotive, arbeitnow]
  skip_seniority: [senior, lead, principal, executive, director, head, vp]
  himalayas_queries: ["operations coordinator", "project coordinator", "project officer", "business support", "virtual assistant", "supply chain", "business development", "market research", "sustainability", "program coordinator"]
  himalayas_pages: 1
  jobicy_tags: [operations, "project coordinator", "virtual assistant", "business support", "supply chain", sustainability]
  wwr_feeds: [remote-management-and-finance-jobs, remote-customer-support-jobs, all-other-remote-jobs, remote-sales-and-marketing-jobs]
  arbeitnow_pages: 2

  # Agregator lokal per negara. OPSIONAL: aktif otomatis kalau secret-nya kamu isi (gratis), kalau tidak diisi dilewati.
  # Adzuna: berbayar sejak 2026, TIDAK dipakai (kode tetap ada kalau suatu hari kamu mau berlangganan).
  adzuna:
    enabled: false               # sejak 2026 BERBAYAR (£8/bln setelah 25 panggilan tes) -> dimatikan. Tidak perlu diisi.
    countries: { uk: gb, netherlands: nl, germany: de, australia: au, new_zealand: nz, italy: it, spain: es, switzerland: ch }
    queries: ["operations coordinator", "project officer", "business support"]
    max_days_old: 3
  # Jooble: JOOBLE_KEY (jooble.org/api/about, minta key lewat form) -> semua negara targetmu.
  jooble:
    enabled: false               # dimatikan (kuota 500 permintaan terlalu kecil)
    locations: { indonesia: Indonesia, malaysia: Malaysia, ireland: Ireland, uk: "United Kingdom", netherlands: Netherlands, germany: Germany, australia: Australia, new_zealand: "New Zealand", italy: Italy, spain: Spain, switzerland: Switzerland, norway: Norway, sweden: Sweden, denmark: Denmark, greece: Greece, iceland: Iceland, saudi_arabia: "Saudi Arabia", qatar: Qatar, kuwait: Kuwait }
    queries: ["operations coordinator", "project officer"]
    # Kuota Jooble default hanya 500 permintaan, jadi radar memakai sedikit per run dan memutar negaranya:
    max_calls_per_run: 4         # 38 kombinasi (19 negara x 2 query) / 4 = semua negara tersapu tiap ±2,5 hari
    max_calls_per_month: 400     # berhenti sendiri di angka ini (reset tiap bulan)
    max_days_old: 3

# Bayt (portal Timur Tengah) lewat JobSpy, tanpa key.
bayt:
  enabled: false                 # dimatikan: Bayt memblokir IP GitHub (HTTP 403). Gulf tetap dicari lewat Indeed.
  countries: { saudi_arabia: "Saudi Arabia", qatar: Qatar, kuwait: Kuwait }
  queries: ["operations coordinator", "project coordinator", "business support", "supply chain coordinator"]
  results_per_search: 20
  hours_old: 72
  max_minutes: 2

# Daftar sponsor resmi pemerintah (UK: Register of Licensed Sponsors; NL: IND recognised sponsors).
# Company ada di daftar -> skor naik + label "terdaftar". UK: tidak ada & deskripsi diam soal sponsor -> skor turun.
sponsor_register:
  enabled: true
  countries: [uk]                # NL dimatikan: halaman IND tidak terbaca dari GitHub Actions
  bonus: 10
  penalty: 10
  strict_countries: []           # isi [uk] untuk MEMBUANG job dari company yang tidak terdaftar (lebih ketat; risiko nama beda)
  # Catatan: daftar Belanda (IND) di webnya hanya tampil sebagian, jadi NL hanya dapat BONUS (tanpa penalti/strict).


# ═════════ 5. FILTER KERAS (gagal satu = langsung dibuang) ═════════
filters:
  include_any: []             # opsional: job HARUS punya salah satu kata ini. Kosong = tidak ada syarat.
  job_types_allowed: [fulltime, contract]   # part-time, internship, temporary otomatis dibuang
  max_years_required: 4       # job yang minta pengalaman > N tahun dibuang ("3-5 years" dihitung 3; "5+ years" dibuang)
  require_english_description: true   # deskripsi berbahasa Jerman/Belanda/Prancis/dll dianggap wajib bahasa lokal -> dibuang. Inggris & Indonesia lolos.

  # Dibuang bila bahasa ini DIWAJIBKAN ("fluent German", "German-speaking"). "German is a plus/desirable" tetap lolos.
  # Wajib degree di bidang di bawah ini (dan tidak menyebut bidang yang cocok untukmu) -> dibuang. Bidangmu: business/management/international/landscape/agri.
  degree_blocked_fields: [chemistry, chemical, biology, biological, biochem*, microbiolog*, biotechnolog*, pharmacy, pharmaceutical*, "life science*", "natural science*", "scientific discipline*", "food science*", "food technology",
    "computer science", "information technology", software, engineering, mathematics, statistics, physics, medicine, medical, nursing, dentistry, "data science", law, legal, accounting, finance, financial, economics, actuarial, "quantitative"]
  degree_ok_fields: [business, management, international, commerce, "supply chain", operations, logistics, marketing, agri*, horticultur*, landscape, environment*, sustainab*, "social science*", "any discipline", "any field", "any subject", "any degree", "all disciplines", "any relevant"]
