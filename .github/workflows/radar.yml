    def get(self, url, headers=None, timeout=None, **kw):
        if "boards-api.greenhouse.io" in url:
            slug = url.split("/boards/")[1].split("/")[0]
            if slug == "foodco":
                return Resp(200, {"jobs": [
                    gh_job(1, "Supply Chain Coordinator", "Cork, Ireland", GOOD + "Visa sponsorship available. Excel, procurement, logistics."),
                    gh_job(2, "Software Engineer", "Dublin, Ireland", "Python"),
                    gh_job(3, "Operations Analyst", "Remote - India", GOOD),
                ]})
            if slug == "intercom":
                return Resp(200, {"jobs": [{"id": 1, "title": "x", "location": {"name": "Dublin"}, "absolute_url": "u"}]})
            return Resp(404, {})
        if url.startswith("https://www.linkedin.com/jobs/view/"):
            jid = url.rsplit("/", 1)[1]
            self.li_calls.append(jid)
            if self.li_block:
                r = Resp(429, {}, text="blocked"); r.url = url; return r
            body = {"2000000001": GOOD + "Visa sponsorship available. ERP, HACCP, inventory.",
                    "2000000003": GOOD + "Fluent German is required.",
                    "2000000004": GOOD + "Procurement, reporting."}.get(jid, GOOD)
            r = Resp(200, None, text=f'<html><div class="show-more-less-html__markup"><p>{body}</p></div>'
                                      '<h3 class="description__job-criteria-subheader">Employment type</h3>'
                                      '<span class="description__job-criteria-text">Full-time</span></html>')
            r.url = url
            return r
        if "foodco.wd3.myworkdayjobs.com/wday/cxs/foodco/Careers/job/" in url:
            path = url.split("/Careers", 1)[1]
            self.wd_detail_calls.append(path)
            if self.wd_detail_empty:
                return Resp(200, {})
            info = {
                "/job/Cork/Supply-Chain-Coordinator_R1": {"title": "Supply Chain Coordinator", "location": "Cork", "country": {"descriptor": "Ireland"},
                    "timeType": "Full time", "jobDescription": "<p>" + GOOD + "Visa sponsorship available. ERP, HACCP, inventory.</p>", "remoteType": ""},
                "/job/Multiple/Ops-Analyst_R2": {"title": "Operations Analyst", "location": "Dublin", "country": {"descriptor": "Ireland"},
                    "timeType": "Full time", "jobDescription": "<p>" + GOOD + "Procurement and reporting. Excel.</p>"},
            }.get(path, {"title": "x", "location": "Cork", "country": {"descriptor": "Ireland"}, "jobDescription": "<p>" + GOOD + "</p>"})
            return Resp(200, {"jobPostingInfo": info})
        if "lever.co" in url or "ashbyhq.com" in url:
            return Resp(404, {})
        if "generativelanguage.googleapis.com" in url and "/models" in url:
            return Resp(200, {"models": [{"name": "models/gemini-9-flash-lite", "supportedGenerationMethods": ["generateContent"]}]})
        raise AssertionError("GET tak terduga: " + url)

    def post(self, url, headers=None, json=None, timeout=None, **kw):
        if "myworkdayjobs.com/wday/cxs/" in url:
            if "/foodco/Careers/jobs" not in url:
                return Resp(404, {})
            self.wd_list_calls.append((json["searchText"], json["offset"], json["limit"]))
            assert json["limit"] <= 20, "Workday menolak limit > 20"
            allp = [{"title": f"Software Engineer {i}", "externalPath": f"/job/X/SE_{i}", "locationsText": "Cork", "postedOn": "Posted 2 Days Ago"} for i in range(20)]
            allp += [{"title": "Quality Coordinator", "externalPath": "/job/Cork/Quality-Coordinator_R9", "locationsText": "Cork, Ireland", "postedOn": "Posted 30+ Days Ago"},
                     {"title": "Supply Chain Coordinator", "externalPath": "/job/Cork/Supply-Chain-Coordinator_R1", "locationsText": "Cork, Ireland", "postedOn": "Posted 3 Days Ago"},
                     {"title": "Operations Analyst", "externalPath": "/job/Multiple/Ops-Analyst_R2", "locationsText": "3 Locations", "postedOn": "Posted Today"}]
            page = allp[json["offset"]: json["offset"] + 20]
            return Resp(200, {"total": len(allp) if json["offset"] == 0 else 0, "jobPostings": page})
        if "api.telegram.org" in url:
            if self.tg_status != 200:
                return Resp(self.tg_status, {"ok": False}, text='{"ok":false,"description":"Unauthorized"}')
            self.tg.append(json["text"])
            return Resp(200, {"ok": True})
        if "generativelanguage.googleapis.com" in url:
            model = url.split("/models/")[1].split(":")[0]
            prompt = json["contents"][0]["parts"][0]["text"]
            self.gemini_calls.append((model, prompt.split("Title: ")[1].split("\n")[0], prompt))
            if self.gemini_mode == "500":
                return Resp(500, {}, text="server err")
            body = {"score": 88, "verdict": "APPLY", "reasons": ["Cocok dengan role ops"], "risks": ["Perlu cek visa"]}
            return Resp(200, {"candidates": [{"content": {"parts": [{"text": "```json\n" + __import__("json").dumps(body) + "\n```"}]}}]})
        raise AssertionError("POST tak terduga: " + url)


