print("\n[J1] Jooble: kuota kecil -> sedikit panggilan per run, rotasi, batas bulanan")
os.environ["JOOBLE_KEY"] = "JK-SECRET"
def jcalls(w): return [u for u in w.urls if "jooble.org" in u]
class WJ(World2):
    def __init__(self):
        super().__init__(); self.jl = []
    def post(self, url, headers=None, json=None, timeout=None, **kw):
        if "jooble.org/api/" in url:
            self.jl.append((json["location"], json["keywords"]))
        return super().post(url, headers=headers, json=json, timeout=timeout, **kw)
w = WJ(); d = fresh(w, patch=FEEDS_J1, countries=("ireland",))
mod, out, err = run_main(d)
check(len(w.jl) == 4, f"run 1: tepat 4 panggilan Jooble (aktual {len(w.jl)})")
first = list(w.jl); w.jl.clear(); mod, out, err = run_main(d)
check(len(w.jl) == 4 and w.jl[0] not in first, f"run 2: 4 panggilan BERBEDA (rotasi): {w.jl[0]}")
seen_loc = set(l for l, _ in first + w.jl)
for _ in range(8):
    w.jl.clear(); run_main(d); seen_loc |= set(l for l, _ in w.jl)
check(len(seen_loc) >= 18, f"setelah ±10 run hampir semua negara tersapu ({len(seen_loc)}/19)")
st = json.loads((d / "state.json").read_text())
check(st["jooble"]["calls"] == 40, f"penghitung bulanan tersimpan ({st['jooble']})")
st["jooble"]["calls"] = 399; (d / "state.json").write_text(json.dumps(st)); w.jl.clear(); run_main(d)
check(len(w.jl) == 1, f"mendekati batas bulanan: hanya sisa kuota yang dipakai ({len(w.jl)})")
w.jl.clear(); run_main(d); check(len(w.jl) == 0, "batas bulanan tercapai: tidak ada panggilan lagi")
st = json.loads((d / "state.json").read_text()); st["jooble"]["month"] = "2020-01"; (d / "state.json").write_text(json.dumps(st)); w.jl.clear(); run_main(d)
check(len(w.jl) == 4, "ganti bulan: penghitung di-reset")
w = WJ(); w.fail = {"jooble"}; d = fresh(w, patch=FEEDS_ON, countries=("ireland",)); mod, out, err = run_main(d)
al = [t for t in w.tg if "jooble" in t and "bermasalah" in t]
check(err is None and al and "JK-SECRET" not in al[0], "Jooble error: alert tanpa membocorkan key, run lanjut")
os.environ.pop("JOOBLE_KEY", None)


