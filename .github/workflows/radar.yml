    d = Path(tempfile.mkdtemp(prefix="radar_"))
    shutil.copy(SRC / "job_watch.py", d)
    cfg = yaml.safe_load((SRC / "config.yml").read_text())
    cfg["countries"] = {k: v for k, v in cfg["countries"].items() if k in countries}
    cfg["role_queries"] = cfg["role_queries"][:2]
    cfg["companies"]["greenhouse"] = ["foodco", "ghost"]
    cfg["telegram"]["summary_hour_utc"] = 0
    cfg["linkedin"]["enabled"] = False
    cfg["bayt"]["enabled"] = False
    cfg["feeds"]["enabled"] = False
    cfg["sponsor_register"]["enabled"] = False
    cfg["sponsorship"]["require_explicit"] = False          # default tes lama; aturan baru dites di [K8]
    for k, v in (patch or {}).items():
        if isinstance(v, dict):
            cfg.setdefault(k, {}).update(v)
        else:
            cfg[k] = v
    (d / "config.yml").write_text(raw if raw is not None else yaml.safe_dump(cfg, allow_unicode=True))
    os.environ["TELEGRAM_TOKEN"], os.environ["TELEGRAM_CHAT_ID"] = "tok", "123"
    os.environ.pop("GEMINI_API_KEY", None)
    if gemini:
        os.environ["GEMINI_API_KEY"] = "key"
    jobspy.scrape_jobs = lambda **kw: world.df(kw)
    requests.get, requests.post = world.get, world.post
    return d


def run_main(d, mode="run", names=""):
    m = load_module(d)
    old, buf, err = sys.argv, io.StringIO(), None
    sys.argv = ["job_watch.py", "--mode", mode, "--names", names]
    try:
        with contextlib.redirect_stdout(buf):
            m.main()
    except Exception as e:
        err = e
    finally:
        sys.argv = old
    return m, buf.getvalue(), err


