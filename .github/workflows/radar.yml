name: job-radar

on:
  schedule:
    - cron: "17 */6 * * *"          # tiap 4 jam (UTC), menit 17 supaya tidak bentrok jam sibuk GitHub
  workflow_dispatch:                 # tombol manual: Actions -> job-radar -> Run workflow
    inputs:
      mode:
        description: "run = normal | dry-run = cuma tes filter (tidak kirim) | test-telegram | find-companies"
        type: choice
        default: run
        options: [run, dry-run, test-telegram, find-companies]
      names:
        description: "Khusus find-companies: nama company dipisah koma (contoh: stripe, intercom, workhuman)"
        required: false
        default: ""

permissions:
  contents: write                    # untuk menyimpan state.json (ingatan anti-duplikat)

concurrency:
  group: job-radar                   # jangan jalan dobel
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          NAMES: ${{ github.event.inputs.names || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python job_watch.py

      - name: Save state (anti-duplikat)
        if: ${{ always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
        run: |
          [ -f state.json ] || exit 0
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "radar: update state"
            git pull --rebase -q || true
            git push
          fi
