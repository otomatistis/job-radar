FAILS = []


def check(cond, msg):
    print(("  PASS " if cond else "  FAIL ") + msg)
    if not cond:
        FAILS.append(msg)


def load_module(workdir):
    name = f"jw_{time.time_ns()}"
    spec = importlib.util.spec_from_file_location(name, workdir / "job_watch.py")
    m = importlib.util.module_from_spec(spec)
    sys.modules[name] = m
    spec.loader.exec_module(m)
    return m


