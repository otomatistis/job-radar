class World2(World):
    def __init__(self):
        super().__init__()
        self.fail, self.urls, self.rows = set(), [], None
        self.reg_fail = False

    def df(self, kw):
        site = kw["site_name"][0]
        if site == "bayt":
            self.searches.append("bayt|" + kw["search_term"][:25] + "|" + str(kw.get("location")))
            out = pd.DataFrame([dict(site="bayt", title="Operations Coordinator", company="Gulf Foods", job_url="https://www.bayt.com/en/saudi-arabia/jobs/ops-coordinator-1/",
                                     location="Riyadh, Saudi Arabia", date_posted=date.today(), description=GOOD + "Visa and relocation provided. ERP, inventory.")])
            out.attrs = {"errors": {}, "warnings": {}}
            return out
        if self.rows is not None and site == "indeed":
            self.searches.append("indeed|" + kw["search_term"][:25])
            out = pd.DataFrame(self.rows(kw)) if self.rows(kw) else pd.DataFrame()
            out.attrs = {"errors": {}, "warnings": {}}
