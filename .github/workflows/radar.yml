GOOD = ("Responsible for coordinating daily operations, reporting and documentation. Strong Excel skills and stakeholder "
        "management. You will work with suppliers, inventory and process improvement initiatives across the business. ")


def J(title="Operations Coordinator", company="Acme Foods", loc="Dublin, Ireland", desc="", **kw):
    return M.Job(source="indeed", title=title, company=company, location=loc, url="https://x/" + title,
                 description=GOOD + desc, **kw)


def verdict(job):
    ok, reason, retry = M.hard_filter(job, R)
    return ok, reason


def passes(job, why=""):
    ok, reason = verdict(job)
    check(ok, f"LOLOS  {why or job.title} ({job.location}) {'' if ok else '<- ' + reason}")
    return ok


def blocks(job, needle, why=""):
    ok, reason = verdict(job)
    check((not ok) and needle in reason, f"BUANG  {why or job.title} ({job.location}) -> '{reason}'")


